<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>FALCÓN OS | Terminal de Ideas y Proyectos</title>
    
    <!-- PWA & Apple Web App Meta -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="FALCÓN TERMINAL">
    <meta name="theme-color" content="#090A0C">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        carbon: '#0D0E10',
                        deep: '#050507',
                        graphite: '#1C1E24',
                        warmWhite: '#F4F2ED',
                        gold: '#C5A059',
                        goldHover: '#B08D4C',
                        terminalGreen: '#10B981',
                        terminalRed: '#EF4444',
                        subtle: '#9CA3AF'
                    },
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"SF Pro Text"', 'sans-serif'],
                        mono: ['"SF Mono", Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace']
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Chart.js para gráficas estilo Bolsa de Valores -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            background-color: #050507;
            color: #F4F2ED;
            -webkit-tap-highlight-color: transparent;
            font-feature-settings: "cv02", "cv03", "cv04", "cv11";
        }
        .terminal-panel {
            background: rgba(13, 14, 16, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(197, 160, 89, 0.2);
        }
        .ticker-tape {
            white-space: nowrap;
            overflow: hidden;
            box-sizing: border-box;
        }
        .ticker-tape span {
            display: inline-block;
            padding-left: 100%;
            animation: ticker 25s linear infinite;
        }
        @keyframes ticker {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-100%, 0, 0); }
        }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden select-none">

    <!-- TICKER SUPERIOR TIPO BOLSA DE VALORES -->
    <div class="bg-carbon border-b border-graphite py-1.5 px-4 text-[11px] font-mono text-subtle flex items-center justify-between shrink-0">
        <div class="flex items-center gap-2 overflow-hidden ticker-tape">
            <span>🔴 FIDIUM INDEX: <strong>+4.25%</strong> | VALUACIÓN CARTERA: <strong>$175,000 MXN</strong> | PROYECTOS ACTIVOS: <strong>EN CURSO</strong> | VOLATILIDAD MERCADO: <strong>ESTABLE</strong></span>
        </div>
        <div class="hidden sm:flex items-center gap-4 text-xs font-mono shrink-0 pl-4 border-l border-graphite">
            <span class="text-terminalGreen">● LIVE FEED</span>
            <span id="live-clock" class="text-gold">00:00:00</span>
        </div>
    </div>

    <div class="flex-1 flex overflow-hidden">
        <!-- BARRA LATERAL EJECUTIVA -->
        <aside id="sidebar" class="w-64 flex flex-col border-r border-graphite bg-carbon transition-all duration-300 z-30 shrink-0">
            <div class="p-5 flex items-center justify-between border-b border-graphite">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-lg bg-gold/10 border border-gold/40 flex items-center justify-center text-gold font-bold text-sm shadow-lg shadow-gold/10 font-mono">
                        SF
                    </div>
                    <div>
                        <span class="font-bold tracking-wider text-xs block text-warmWhite">FALCÓN TERMINAL</span>
                        <span class="text-[9px] text-gold tracking-widest uppercase font-mono">Equity & Projects</span>
                    </div>
                </div>
            </div>

            <nav class="flex-1 overflow-y-auto px-3 py-4 space-y-1">
                <button onclick="switchView('ideas')" id="nav-ideas" class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-medium transition bg-graphite text-warmWhite border border-gold/30 shadow-sm">
                    <i data-lucide="lightbulb" class="w-4 h-4 text-gold"></i>
                    <span>Banco de Ideas</span>
                </button>
                <button onclick="switchView('projects')" id="nav-projects" class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-medium transition text-subtle hover:bg-carbon hover:text-warmWhite">
                    <i data-lucide="briefcase" class="w-4 h-4 text-subtle"></i>
                    <span>Gestor de Proyectos</span>
                </button>
            </nav>

            <div class="p-4 border-t border-graphite flex items-center gap-3 bg-deep/50">
                <div class="w-9 h-9 rounded-full bg-graphite border border-gold/40 flex items-center justify-center text-xs font-bold text-gold font-mono">
                    SF
                </div>
                <div class="overflow-hidden">
                    <p class="text-xs font-medium truncate text-warmWhite">Saúl Falcón V.</p>
                    <p class="text-[10px] text-subtle truncate font-mono">Dirección General</p>
                </div>
            </div>
        </aside>

        <!-- CONTENEDOR PRINCIPAL -->
        <div class="flex-1 flex flex-col min-w-0 overflow-hidden bg-deep">
            
            <!-- HEADER DE NAVEGACIÓN -->
            <header class="h-16 border-b border-graphite bg-carbon/80 backdrop-blur-md px-6 flex items-center justify-between z-20 shrink-0">
                <div class="flex items-center gap-4">
                    <span id="header-title" class="text-xs font-mono uppercase tracking-widest text-gold font-bold">
                        // BANCO DE IDEAS Y OPORTUNIDADES
                    </span>
                </div>

                <div class="flex items-center gap-3">
                    <button onclick="openModal()" class="px-4 py-2 bg-gold text-deep font-bold font-mono text-xs rounded-xl hover:bg-goldHover transition flex items-center gap-1.5 shadow-lg shadow-gold/20">
                        <i data-lucide="plus" class="w-3.5 h-3.5"></i> <span id="btn-modal-text">NUEVA IDEA</span>
                    </button>
                </div>
            </header>

            <!-- ÁREA DE CONTENIDO CON GRÁFICAS -->
            <main id="main-content" class="flex-1 overflow-y-auto p-6 space-y-6">
                <!-- Inyectado dinámicamente -->
            </main>
        </div>
    </div>

    <!-- MODAL GENERAL ESTILO TERMINAL -->
    <div id="modal-backdrop" class="fixed inset-0 bg-black/85 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="terminal-panel w-full max-w-lg rounded-3xl p-6 border border-graphite space-y-4 shadow-2xl">
            <div class="flex justify-between items-center border-b border-graphite pb-3">
                <h3 id="modal-title" class="text-xs font-mono font-bold uppercase tracking-wider text-gold">// NUEVO REGISTRO</h3>
                <button onclick="closeModal()" class="text-subtle hover:text-warmWhite"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <div id="modal-body" class="space-y-3 font-mono">
                <!-- Formulario -->
            </div>
        </div>
    </div>

    <!-- MOTOR JAVASCRIPT & CHART.JS -->
    <script>
        const defaultState = {
            activeView: 'ideas', // 'ideas' o 'projects'
            ideas: [
                { id: 1, name: 'Plataforma automatizada de contratos transfronterizos MX-CL', category: 'Legal Tech', potential: 150000, status: 'En evaluación' },
                { id: 2, name: 'Expansión corporativa Reyno Boots USA', category: 'Comercio Internacional', potential: 280000, status: 'Aprobada' }
            ],
            projects: [
                { id: 1, title: 'Registro Marcas INAPI / IMPI', client: 'FIDIUM Direct', budget: 35000, status: 'Activo' },
                { id: 2, title: 'Reestructuración Corporativa Impeweb', client: 'Impeweb Soluciones', budget: 95000, status: 'Activo' }
            ]
        };

        let appState = JSON.parse(localStorage.getItem('falcon_terminal_state')) || defaultState;

        function saveState() {
            localStorage.setItem('falcon_terminal_state', JSON.stringify(appState));
            renderApp();
        }

        function switchView(view) {
            appState.activeView = view;
            renderApp();
        }

        // Reloj en vivo estilo Bloomberg
        setInterval(() => {
            const now = new Date();
            const clockEl = document.getElementById('live-clock');
            if(clockEl) clockEl.innerText = now.toLocaleTimeString();
        }, 1000);

        function renderApp() {
            const isIdeas = appState.activeView === 'ideas';
            
            document.getElementById('nav-ideas').className = `w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-medium transition ${isIdeas ? 'bg-graphite text-warmWhite border border-gold/30 shadow-sm' : 'text-subtle hover:bg-carbon hover:text-warmWhite'}`;
            document.getElementById('nav-projects').className = `w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-medium transition ${!isIdeas ? 'bg-graphite text-warmWhite border border-gold/30 shadow-sm' : 'text-subtle hover:bg-carbon hover:text-warmWhite'}`;

            document.getElementById('header-title').innerText = isIdeas ? '// BANCO DE IDEAS Y OPORTUNIDADES' : '// GESTOR DE PROYECTOS Y PRESUPUESTOS';
            document.getElementById('btn-modal-text').innerText = isIdeas ? 'NUEVA IDEA' : 'NUEVO PROYECTO';

            const mainContent = document.getElementById('main-content');

            if (isIdeas) {
                const totalPotential = appState.ideas.reduce((acc, i) => acc + i.potential, 0);

                mainContent.innerHTML = `
                    <!-- WIDGETS DE ESTADÍSTICAS ESTILO BOLSA -->
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 font-mono">
                        <div class="terminal-panel p-4 rounded-2xl border border-graphite">
                            <span class="text-[10px] text-subtle uppercase">Valor Potencial Cartera</span>
                            <p class="text-xl font-bold text-gold mt-1">$${totalPotential.toLocaleString()} MXN</p>
                            <span class="text-[10px] text-terminalGreen mt-1 block">▲ Proyección Q4</span>
                        </div>
                        <div class="terminal-panel p-4 rounded-2xl border border-graphite">
                            <span class="text-[10px] text-subtle uppercase">Ideas Evaluadas</span>
                            <p class="text-xl font-bold text-warmWhite mt-1">${appState.ideas.length} Activas</p>
                            <span class="text-[10px] text-subtle mt-1 block">Pipeline óptimo</span>
                        </div>
                        <div class="terminal-panel p-4 rounded-2xl border border-graphite">
                            <span class="text-[10px] text-subtle uppercase">Índice de Viabilidad</span>
                            <p class="text-xl font-bold text-terminalGreen mt-1">94.8%</p>
                            <span class="text-[10px] text-terminalGreen mt-1 block">Alta rentabilidad</span>
                        </div>
                    </div>

                    <!-- GRÁFICA INTERACTIVA -->
                    <div class="terminal-panel p-5 rounded-2xl border border-graphite space-y-3">
                        <div class="flex justify-between items-center font-mono text-xs">
                            <span class="text-gold uppercase tracking-wider">// Análisis de Potencial Económico por Idea</span>
                            <span class="text-subtle">Gráfica Interactiva</span>
                        </div>
                        <div class="h-64 relative">
                            <canvas id="ideasChart"></canvas>
                        </div>
                    </div>

                    <!-- TARJETAS DE IDEAS -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        ${appState.ideas.map(i => `
                            <div class="terminal-panel p-5 rounded-2xl border border-graphite space-y-3 flex flex-col justify-between">
                                <div class="space-y-1.5">
                                    <div class="flex justify-between items-start">
                                        <h4 class="text-sm font-bold text-warmWhite">${i.name}</h4>
                                        <span class="text-[10px] px-2 py-0.5 rounded bg-gold/10 text-gold border border-gold/20 font-mono">${i.status}</span>
                                    </div>
                                    <p class="text-xs text-subtle font-mono">Categoría: ${i.category}</p>
                                </div>
                                <div class="flex justify-between items-center pt-3 border-t border-graphite font-mono">
                                    <span class="text-xs text-gold font-bold">Potencial: $${i.potential.toLocaleString()} MXN</span>
                                    <button onclick="deleteIdea(${i.id})" class="text-subtle hover:text-terminalRed p-1"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;

                setTimeout(() => renderIdeasChart(), 50);

            } else {
                const totalBudget = appState.projects.reduce((acc, p) => acc + p.budget, 0);

                mainContent.innerHTML = `
                    <!-- WIDGETS PROYECTOS -->
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 font-mono">
                        <div class="terminal-panel p-4 rounded-2xl border border-graphite">
                            <span class="text-[10px] text-subtle uppercase">Presupuesto Asignado</span>
                            <p class="text-xl font-bold text-gold mt-1">$${totalBudget.toLocaleString()} MXN</p>
                            <span class="text-[10px] text-terminalGreen mt-1 block">▲ Ejecución en curso</span>
                        </div>
                        <div class="terminal-panel p-4 rounded-2xl border border-graphite">
                            <span class="text-[10px] text-subtle uppercase">Proyectos en Ruta</span>
                            <p class="text-xl font-bold text-warmWhite mt-1">${appState.projects.length} Activos</p>
                            <span class="text-[10px] text-subtle mt-1 block">FIDIUM & Empresas</span>
                        </div>
                        <div class="terminal-panel p-4 rounded-2xl border border-graphite">
                            <span class="text-[10px] text-subtle uppercase">Estatus Operativo</span>
                            <p class="text-xl font-bold text-terminalGreen mt-1">100% OK</p>
                            <span class="text-[10px] text-terminalGreen mt-1 block">Sin retrasos críticos</span>
                        </div>
                    </div>

                    <!-- GRÁFICA INTERACTIVA PROYECTOS -->
                    <div class="terminal-panel p-5 rounded-2xl border border-graphite space-y-3">
                        <div class="flex justify-between items-center font-mono text-xs">
                            <span class="text-gold uppercase tracking-wider">// Distribución de Presupuesto por Proyecto</span>
                            <span class="text-subtle">Gráfica Interactiva</span>
                        </div>
                        <div class="h-64 relative">
                            <canvas id="projectsChart"></canvas>
                        </div>
                    </div>

                    <!-- LISTA DE PROYECTOS -->
                    <div class="space-y-3">
                        ${appState.projects.map(p => `
                            <div class="terminal-panel p-5 rounded-2xl border border-graphite flex justify-between items-center font-mono">
                                <div class="space-y-1">
                                    <h4 class="text-sm font-bold text-warmWhite">${p.title}</h4>
                                    <p class="text-xs text-subtle">Cliente / Área: ${p.client} • Presupuesto: <span class="text-gold font-bold">$${p.budget.toLocaleString()} MXN</span></p>
                                </div>
                                <div class="flex items-center gap-3">
                                    <span class="text-[10px] px-2.5 py-1 rounded-lg bg-emerald-500/10 text-terminalGreen font-semibold border border-emerald-500/20">${p.status}</span>
                                    <button onclick="deleteProject(${p.id})" class="text-subtle hover:text-terminalRed p-1"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;

                setTimeout(() => renderProjectsChart(), 50);
            }

            lucide.createIcons();
        }

        // Gráfica de Ideas (Chart.js)
        function renderIdeasChart() {
            const ctx = document.getElementById('ideasChart');
            if(!ctx) return;
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: appState.ideas.map(i => i.name.substring(0, 20) + '...'),
                    datasets: [{
                        label: 'Potencial Económico (MXN)',
                        data: appState.ideas.map(i => i.potential),
                        backgroundColor: '#C5A059',
                        borderColor: '#E6C580',
                        borderWidth: 1,
                        borderRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { ticks: { color: '#9CA3AF', font: { family: 'monospace', size: 10 } }, grid: { color: '#1C1E24' } },
                        y: { ticks: { color: '#9CA3AF', font: { family: 'monospace', size: 10 } }, grid: { color: '#1C1E24' } }
                    }
                }
            });
        }

        // Gráfica de Proyectos (Chart.js)
        function renderProjectsChart() {
            const ctx = document.getElementById('projectsChart');
            if(!ctx) return;
            new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: appState.projects.map(p => p.title),
                    datasets: [{
                        data: appState.projects.map(p => p.budget),
                        backgroundColor: ['#C5A059', '#10B981', '#3B82F6', '#8B5CF6'],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { 
                        legend: { position: 'bottom', labels: { color: '#9CA3AF', font: { family: 'monospace', size: 11 } } } 
                    }
                }
            });
        }

        // Modales y Formularios
        function openModal() {
            document.getElementById('modal-backdrop').classList.remove('hidden');
            const titleEl = document.getElementById('modal-title');
            const bodyEl = document.getElementById('modal-body');
            const isIdeas = appState.activeView === 'ideas';

            if (isIdeas) {
                titleEl.innerText = '// REGISTRAR NUEVA IDEA';
                bodyEl.innerHTML = `
                    <input type="text" id="idea-name" placeholder="Nombre de la idea..." class="w-full bg-carbon border border-graphite rounded-xl p-3 text-xs text-warmWhite focus:outline-none focus:border-gold">
                    <input type="text" id="idea-cat" placeholder="Categoría (Ej: Legal Tech)..." class="w-full bg-carbon border border-graphite rounded-xl p-3 text-xs text-warmWhite focus:outline-none focus:border-gold">
                    <input type="number" id="idea-pot" placeholder="Potencial económico numérico (Ej: 50000)..." class="w-full bg-carbon border border-graphite rounded-xl p-3 text-xs text-warmWhite focus:outline-none focus:border-gold">
                    <button onclick="saveIdea()" class="w-full py-3 bg-gold text-deep font-bold font-mono text-xs rounded-xl mt-2 hover:bg-goldHover transition">GUARDAR EN PIPELINE</button>
                `;
            } else {
                titleEl.innerText = '// REGISTRAR NUEVO PROYECTO';
                bodyEl.innerHTML = `
                    <input type="text" id="proj-title" placeholder="Título del proyecto..." class="w-full bg-carbon border border-graphite rounded-xl p-3 text-xs text-warmWhite focus:outline-none focus:border-gold">
                    <input type="text" id="proj-client" placeholder="Cliente o área asociada..." class="w-full bg-carbon border border-graphite rounded-xl p-3 text-xs text-warmWhite focus:outline-none focus:border-gold">
                    <input type="number" id="proj-budget" placeholder="Presupuesto numérico (Ej: 25000)..." class="w-full bg-carbon border border-graphite rounded-xl p-3 text-xs text-warmWhite focus:outline-none focus:border-gold">
                    <button onclick="saveProject()" class="w-full py-3 bg-gold text-deep font-bold font-mono text-xs rounded-xl mt-2 hover:bg-goldHover transition">GUARDAR PROYECTO</button>
                `;
            }
        }

        function closeModal() {
            document.getElementById('modal-backdrop').classList.add('hidden');
        }

        function saveIdea() {
            const name = document.getElementById('idea-name').value;
            const category = document.getElementById('idea-cat').value;
            const potential = parseFloat(document.getElementById('idea-pot').value);
            if(!name || isNaN(potential)) return;
            appState.ideas.push({ id: Date.now(), name, category: category || 'General', potential, status: 'Nueva' });
            saveState();
            closeModal();
        }

        function deleteIdea(id) {
            appState.ideas = appState.ideas.filter(i => i.id !== id);
            saveState();
        }

        function saveProject() {
            const title = document.getElementById('proj-title').value;
            const client = document.getElementById('proj-client').value;
            const budget = parseFloat(document.getElementById('proj-budget').value);
            if(!title || isNaN(budget)) return;
            appState.projects.push({ id: Date.now(), title, client: client || 'General', budget, status: 'Activo' });
            saveState();
            closeModal();
        }

        function deleteProject(id) {
            appState.projects = appState.projects.filter(p => p.id !== id);
            saveState();
        }

        renderApp();
    </script>
</body>
</html>
