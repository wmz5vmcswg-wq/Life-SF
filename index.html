<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AURA Life OS | Executive Control</title>
    
    <!-- PWA & Apple Web App Meta -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="AURA OS">
    <meta name="theme-color" content="#000000">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        pitch: '#050505',
                        card: '#0D0D0E',
                        border: '#1E1E22',
                        accent: '#E6B800',
                        accentDark: '#B38F00',
                        subtle: '#A1A1AA'
                    },
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"SF Pro Text"', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            background-color: #000000;
            color: #F4F4F5;
            -webkit-tap-highlight-color: transparent;
            font-feature-settings: "cv02", "cv03", "cv04", "cv11";
        }
        .glass-card {
            background: rgba(13, 13, 14, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between pb-24 pt-12 px-4 max-w-md mx-auto relative select-none">

    <!-- HEADER / PROFILE -->
    <header class="flex justify-between items-center mb-6">
        <div>
            <p class="text-xs font-semibold text-accent uppercase tracking-widest" id="live-date">Cargando fecha...</p>
            <h1 class="text-2xl font-bold tracking-tight text-white mt-0.5">AURA OS</h1>
        </div>
        <div class="flex items-center gap-3">
            <button onclick="exportToAppleCalendar()" class="p-2.5 rounded-full glass-card text-accent hover:bg-accent/10 transition active:scale-95" title="Exportar a Apple Calendar">
                <i data-lucide="calendar"></i>
            </button>
            <div class="w-10 h-10 rounded-full border border-accent/40 flex items-center justify-center font-bold text-sm bg-card text-accent shadow-lg shadow-accent/10">
                SF
            </div>
        </div>
    </header>

    <!-- AREA FILTERS / NAVIGATION -->
    <nav class="flex gap-2 overflow-x-auto hide-scrollbar mb-6 pb-1">
        <button onclick="filterArea('all')" class="area-btn active-area px-4 py-2 rounded-full text-xs font-medium border border-accent bg-accent text-black transition shrink-0" data-area="all">
            General
        </button>
        <button onclick="filterArea('CGE')" class="area-btn px-4 py-2 rounded-full text-xs font-medium border border-border bg-card text-subtle transition shrink-0" data-area="CGE">
            CGE / Institucional
        </button>
        <button onclick="filterArea('FIDIUM')" class="area-btn px-4 py-2 rounded-full text-xs font-medium border border-border bg-card text-subtle transition shrink-0" data-area="FIDIUM">
            FIDIUM Legal
        </button>
        <button onclick="filterArea('Empresas')" class="area-btn px-4 py-2 rounded-full text-xs font-medium border border-border bg-card text-subtle transition shrink-0" data-area="Empresas">
            Reyno & Impeweb
        </button>
        <button onclick="filterArea('Rendimiento')" class="area-btn px-4 py-2 rounded-full text-xs font-medium border border-border bg-card text-subtle transition shrink-0" data-area="Rendimiento">
            Alto Rendimiento
        </button>
    </nav>

    <!-- MAIN DASHBOARD CONTENT -->
    <main class="space-y-6 flex-1">

        <!-- METRIC SUMMARY CARD -->
        <section class="glass-card rounded-3xl p-5 border border-border shadow-xl">
            <div class="flex justify-between items-start mb-4">
                <div>
                    <span class="text-xs text-subtle font-medium">Ejecución del Día</span>
                    <h2 class="text-xl font-bold text-white mt-0.5" id="completion-rate">0% Completado</h2>
                </div>
                <div class="p-2 rounded-xl bg-accent/10 text-accent">
                    <i data-lucide="zap" class="w-5 h-5"></i>
                </div>
            </div>
            <!-- Progress Bar -->
            <div class="w-full bg-border h-2.5 rounded-full overflow-hidden">
                <div id="progress-bar" class="bg-accent h-full transition-all duration-500 rounded-full" style="width: 0%"></div>
            </div>
        </section>

        <!-- HIGH PERFORMANCE / DAILY HABITS -->
        <section class="space-y-3" id="habits-section">
            <div class="flex justify-between items-center px-1">
                <h3 class="text-sm font-semibold tracking-wider text-subtle uppercase">Hábitos & Rutinas</h3>
                <span class="text-xs text-accent font-medium">6:00 AM Routine</span>
            </div>

            <div id="habits-container" class="space-y-2.5">
                <!-- Dynamic Habits inserted by JS -->
            </div>
        </section>

        <!-- PROJECTS & KANBAN TASKS -->
        <section class="space-y-3" id="tasks-section">
            <div class="flex justify-between items-center px-1">
                <h3 class="text-sm font-semibold tracking-wider text-subtle uppercase">Proyectos & Prioridades</h3>
                <button onclick="openAddTaskModal()" class="text-xs text-accent hover:underline flex items-center gap-1 font-medium">
                    <i data-lucide="plus" class="w-3.5 h-3.5"></i> Nueva Tarea
                </button>
            </div>

            <div id="tasks-container" class="space-y-2.5">
                <!-- Dynamic Tasks inserted by JS -->
            </div>
        </section>

        <!-- APPLE & SIRI INTEGRATION BANNER -->
        <section class="glass-card rounded-2xl p-4 border border-accent/20 bg-gradient-to-r from-card to-accent/5">
            <div class="flex items-center gap-3">
                <div class="p-2.5 rounded-xl bg-accent text-black font-bold">
                    <i data-lucide="mic" class="w-5 h-5"></i>
                </div>
                <div class="flex-1">
                    <h4 class="text-sm font-semibold text-white">Comandos de Siri & Atajos</h4>
                    <p class="text-xs text-subtle mt-0.5">Sincroniza eventos y registra hábitos por voz.</p>
                </div>
                <button onclick="generateSiriShortcutHelp()" class="px-3 py-1.5 rounded-lg border border-accent/40 text-accent text-xs font-semibold hover:bg-accent/10 transition">
                    Ver Atajo
                </button>
            </div>
        </section>

    </main>

    <!-- FLOATING QUICK ADD BUTTON -->
    <div class="fixed bottom-6 right-6 left-6 max-w-md mx-auto flex justify-end pointer-events-none z-40">
        <button onclick="openAddTaskModal()" class="pointer-events-auto bg-accent text-black p-4 rounded-full shadow-2xl shadow-accent/40 active:scale-95 transition flex items-center justify-center font-bold">
            <i data-lucide="plus" class="w-6 h-6"></i>
        </button>
    </div>

    <!-- MODAL NUEVA TAREA / EVENTO -->
    <div id="modal-backdrop" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-4">
        <div class="glass-card w-full max-w-sm rounded-3xl p-6 border border-border space-y-4">
            <div class="flex justify-between items-center">
                <h3 class="text-lg font-bold text-white">Nueva Prioridad</h3>
                <button onclick="closeAddTaskModal()" class="text-subtle hover:text-white">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            
            <form id="task-form" onsubmit="saveTask(event)" class="space-y-3">
                <div>
                    <label class="text-xs text-subtle block mb-1">Título</label>
                    <input type="text" id="task-title" required class="w-full bg-pitch border border-border rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-accent">
                </div>
                
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-xs text-subtle block mb-1">Área</label>
                        <select id="task-area" class="w-full bg-pitch border border-border rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-accent">
                            <option value="CGE">CGE / Institucional</option>
                            <option value="FIDIUM">FIDIUM Legal</option>
                            <option value="Empresas">Reyno & Impeweb</option>
                            <option value="Rendimiento">Alto Rendimiento</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-xs text-subtle block mb-1">Hora / Tiempo</label>
                        <input type="text" id="task-time" placeholder="Ej: 06:00 AM" class="w-full bg-pitch border border-border rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-accent">
                    </div>
                </div>

                <div class="pt-2 flex gap-3">
                    <button type="button" onclick="closeAddTaskModal()" class="flex-1 py-2.5 rounded-xl border border-border text-subtle text-xs font-semibold">Cancelar</button>
                    <button type="submit" class="flex-1 py-2.5 rounded-xl bg-accent text-black text-xs font-bold shadow-lg shadow-accent/20">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- JAVASCRIPT APP ENGINE -->
    <script>
        // Data Schema with LocalStorage Persistence
        const defaultState = {
            activeFilter: 'all',
            habits: [
                { id: 'h1', title: 'Entrenamiento de Fuerza (6:00 AM)', area: 'Rendimiento', done: false },
                { id: 'h2', title: 'Nutrición Alta en Proteína', area: 'Rendimiento', done: false },
                { id: 'h3', title: 'Artes Marciales / Cardio', area: 'Rendimiento', done: false },
                { id: 'h4', title: 'Revisión Agenda CGE', area: 'CGE', done: false }
            ],
            tasks: [
                { id: 't1', title: 'Registro Marcas & Asesoría Legal', area: 'FIDIUM', time: '10:00 AM', status: 'pending' },
                { id: 't2', title: 'Reunión Operativa Impeweb / Reyno', area: 'Empresas', time: '02:00 PM', status: 'pending' },
                { id: 't3', title: 'Sesión de Consejo General Estudiantil', area: 'CGE', time: '05:00 PM', status: 'pending' }
            ]
        };

        let appState = JSON.parse(localStorage.getItem('aura_state')) || defaultState;

        function saveState() {
            localStorage.setItem('aura_state', JSON.stringify(appState));
            render();
        }

        function updateDateDisplay() {
            const now = new Date();
            const options = { weekday: 'long', day: 'numeric', month: 'short' };
            document.getElementById('live-date').innerText = now.toLocaleDateString('es-ES', options);
        }

        function filterArea(area) {
            appState.activeFilter = area;
            document.querySelectorAll('.area-btn').forEach(btn => {
                if(btn.dataset.area === area) {
                    btn.className = "area-btn active-area px-4 py-2 rounded-full text-xs font-medium border border-accent bg-accent text-black transition shrink-0";
                } else {
                    btn.className = "area-btn px-4 py-2 rounded-full text-xs font-medium border border-border bg-card text-subtle transition shrink-0";
                }
            });
            render();
        }

        function toggleHabit(id) {
            const habit = appState.habits.find(h => h.id === id);
            if (habit) habit.done = !habit.done;
            saveState();
        }

        function toggleTaskStatus(id) {
            const task = appState.tasks.find(t => t.id === id);
            if (task) {
                task.status = task.status === 'completed' ? 'pending' : 'completed';
            }
            saveState();
        }

        function deleteTask(id) {
            appState.tasks = appState.tasks.filter(t => t.id !== id);
            saveState();
        }

        function render() {
            const habitContainer = document.getElementById('habits-container');
            const taskContainer = document.getElementById('tasks-container');

            // Render Habits
            const filteredHabits = appState.activeFilter === 'all' 
                ? appState.habits 
                : appState.habits.filter(h => h.area === appState.activeFilter);

            habitContainer.innerHTML = filteredHabits.map(h => `
                <div onclick="toggleHabit('${h.id}')" class="glass-card p-3.5 rounded-2xl flex items-center justify-between border border-border cursor-pointer active:scale-98 transition">
                    <div class="flex items-center gap-3">
                        <div class="w-5 h-5 rounded-full border border-accent flex items-center justify-center ${h.done ? 'bg-accent text-black' : ''}">
                            ${h.done ? '<i data-lucide="check" class="w-3.5 h-3.5 stroke-[3]"></i>' : ''}
                        </div>
                        <span class="text-xs font-medium ${h.done ? 'line-through text-subtle' : 'text-white'}">${h.title}</span>
                    </div>
                    <span class="text-[10px] font-semibold px-2 py-0.5 rounded-md border border-border text-subtle bg-pitch">${h.area}</span>
                </div>
            `).join('');

            // Render Tasks
            const filteredTasks = appState.activeFilter === 'all' 
                ? appState.tasks 
                : appState.tasks.filter(t => t.area === appState.activeFilter);

            taskContainer.innerHTML = filteredTasks.map(t => `
                <div class="glass-card p-4 rounded-2xl border border-border flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <button onclick="toggleTaskStatus('${t.id}')" class="w-5 h-5 rounded-md border border-border flex items-center justify-center ${t.status === 'completed' ? 'bg-accent text-black border-accent' : 'text-transparent'}">
                            <i data-lucide="check" class="w-3.5 h-3.5 stroke-[3]"></i>
                        </button>
                        <div>
                            <p class="text-xs font-medium ${t.status === 'completed' ? 'line-through text-subtle' : 'text-white'}">${t.title}</p>
                            <span class="text-[10px] text-subtle flex items-center gap-1 mt-0.5">
                                <i data-lucide="clock" class="w-3 h-3"></i> ${t.time || 'Hoy'} • ${t.area}
                            </span>
                        </div>
                    </div>
                    <button onclick="deleteTask('${t.id}')" class="text-subtle hover:text-red-400 p-1">
                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                    </button>
                </div>
            `).join('');

            // Progress Metrics
            const totalItems = appState.habits.length + appState.tasks.length;
            const completedItems = appState.habits.filter(h => h.done).length + appState.tasks.filter(t => t.status === 'completed').length;
            const percentage = totalItems > 0 ? Math.round((completedItems / totalItems) * 100) : 0;

            document.getElementById('completion-rate').innerText = `${percentage}% Completado`;
            document.getElementById('progress-bar').style.width = `${percentage}%`;

            lucide.createIcons();
        }

        // Modal Handlers
        function openAddTaskModal() {
            document.getElementById('modal-backdrop').classList.remove('hidden');
        }

        function closeAddTaskModal() {
            document.getElementById('modal-backdrop').classList.add('hidden');
        }

        function saveTask(e) {
            e.preventDefault();
            const title = document.getElementById('task-title').value;
            const area = document.getElementById('task-area').value;
            const time = document.getElementById('task-time').value;

            appState.tasks.push({
                id: 't_' + Date.now(),
                title,
                area,
                time,
                status: 'pending'
            });

            saveState();
            closeAddTaskModal();
            document.getElementById('task-form').reset();
        }

        // Export Apple Calendar (.ics)
        function exportToAppleCalendar() {
            let icsContent = "BEGIN:VCALENDAR\nVERSION:2.0\nPRODID:-//AURA OS//SF//ES\n";
            appState.tasks.forEach(t => {
                icsContent += `BEGIN:VEVENT\nSUMMARY:[${t.area}] ${t.title}\nDESCRIPTION:Prioridad de AURA OS\nEND:VEVENT\n`;
            });
            icsContent += "END:VCALENDAR";

            const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8' });
            const link = document.createElement('a');
            link.href = window.URL.createObjectURL(blob);
            link.setAttribute('download', 'aura_agenda.ics');
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function generateSiriShortcutHelp() {
            alert("Para conectar con Siri:\n1. Abre la app 'Atajos' en tu iPhone.\n2. Crea un atajo que abra este enlace web.\n3. Nómbralo 'Oye Siri, abrir mi control de vida'.");
        }

        // Initialize
        updateDateDisplay();
        render();
    </script>
</body>
</html>
